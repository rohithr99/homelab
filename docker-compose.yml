services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports: [ "3000:3000" ]
    environment:
      # Newer Homepage versions reject requests from unknown hostnames.
      # "*" is fine on a private network; tighten it later if you like.
      HOMEPAGE_ALLOWED_HOSTS: "*"
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    ports: [ "3001:3001" ]
    volumes: [ "./config/uptime-kuma:/app/data" ]
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    ports: [ "8082:80" ]
    volumes: [ "./config/vaultwarden:/data" ]
    restart: unless-stopped

#  pihole:
#    image: pihole/pihole:latest
#    container_name: pihole
#    ports:
#      - "53:53/tcp"
#      - "53:53/udp"
#      - "80:80/tcp"
#    environment:
#      TZ: 'UTC'
#      WEBPASSWORD: ${PIHOLE_WEBPASSWORD}
#    volumes: [ "./config/pihole:/etc/pihole" ]
#    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      PUID: "1000"
      PGID: "1000"
      WEBUI_PORT: "8080"
    volumes:
      - ./config/qbittorrent:/config
      - /storage/downloads:/downloads
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports: [ "9696:9696" ]
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes: [ "./config/prowlarr:/config" ]
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports: [ "7878:7878" ]
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./config/radarr:/config
      - /storage/downloads:/downloads
      - /storage/media:/data/media
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports: [ "8989:8989" ]
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./config/sonarr:/config
      - /storage/downloads:/downloads
      - /storage/media:/data/media
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      LOG_LEVEL: info
      TZ: Asia/Kolkata
    ports: [ "5055:5055" ]
    volumes:
      - ./config/seerr:/app/config
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    ports: [ "8096:8096" ]
    devices: [ "/dev/dri:/dev/dri" ] # Intel QuickSync hardware transcoding
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./config/jellyfin:/config
      - /storage/media:/data/media
    restart: unless-stopped

